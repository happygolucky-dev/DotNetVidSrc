name: Release

# Tag a commit to ship:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GitHub Packages
  id-token: write   # OIDC token for nuget.org Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack (version from tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/VidSrc -c Release -p:Version="$VERSION" -o artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # nuget.org via Trusted Publishing (OIDC) — no API key secret needed.
      # Registered at nuget.org → Account → Trusted Publishing for this repo/workflow.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: dev.happygolucky

      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg \
            --title "DotNetVidSrc ${GITHUB_REF_NAME}" \
            --generate-notes
